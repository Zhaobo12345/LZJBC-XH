<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 个人电子名片</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-content {
            height: calc(100% - 44px);
            background-color: var(--bg-secondary);
            overflow-y: auto;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            padding: 32px 16px 24px;
            color: #FFFFFF;
            text-align: center;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            margin: 0 auto 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .profile-name {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .profile-role {
            font-size: 14px;
            opacity: 0.9;
        }

        .profile-section {
            background-color: var(--bg-primary);
            margin: 12px 16px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .section-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-content {
            padding: 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-item .label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .info-item .value {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .role-badge.manager {
            background-color: #F9F0FF;
            color: #722ED1;
        }

        .role-badge.foreman {
            background-color: #F6FFED;
            color: #52C41A;
        }

        .role-badge.owner {
            background-color: #FFF7E6;
            color: #FA8C16;
        }

        .role-badge.designer {
            background-color: #E6F7FF;
            color: #1890FF;
        }

        .role-badge.worker {
            background-color: #FFF0F0;
            color: #F5222D;
        }

        .project-list {
            margin-top: 8px;
        }

        .project-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }

        .project-item:hover {
            background-color: #E6F7FF;
        }

        .project-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-size: 16px;
            margin-right: 12px;
        }

        .project-info {
            flex: 1;
        }

        .project-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .project-role {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .arrow {
            color: var(--text-tertiary);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }

        .empty-state .empty-icon {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .empty-state .empty-text {
            font-size: 14px;
        }

        .action-section {
            padding: 24px 16px;
        }

        .action-btn {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-family: inherit;
            cursor: pointer;
            margin-bottom: 12px;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .action-btn.primary:hover {
            background-color: var(--primary-light);
        }

        .action-btn.secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .action-btn.secondary:hover {
            background-color: #F0F0F0;
        }

        .action-btn.danger {
            background-color: var(--status-error-bg);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        .action-btn.danger:hover {
            background-color: var(--error-color);
            color: #FFFFFF;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .skill-tag {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">📶 🔋</div>
        </div>
        
        <div class="nav-bar">
            <div class="back" onclick="history.back()">← 返回</div>
            <div class="title centered">个人电子名片</div>
            <div class="actions">
                <div class="action-btn" onclick="closeMiniProgram()">✕</div>
            </div>
        </div>
        
        <div class="page-content">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">张</div>
                <div class="profile-name" id="profileName">张三</div>
                <div class="profile-role" id="profileRole">项目部 · 项目经理</div>
            </div>
            
            <div class="profile-section">
                <div class="section-header">基本信息</div>
                <div class="section-content">
                    <div class="info-item">
                        <div class="label">姓名</div>
                        <div class="value" id="infoName">张三</div>
                    </div>
                    <div class="info-item">
                        <div class="label">角色</div>
                        <div class="value">
                            <span class="role-badge manager" id="infoRoleBadge">项目总</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="label">所属架构</div>
                        <div class="value" id="infoGroup">项目部</div>
                    </div>
                    <div class="info-item">
                        <div class="label">联系方式</div>
                        <div class="value">138****8888</div>
                    </div>
                </div>
            </div>
            
            <div class="profile-section">
                <div class="section-header">专业技能</div>
                <div class="section-content">
                    <div class="skill-tags" id="skillTags">
                        <span class="skill-tag">项目管理</span>
                        <span class="skill-tag">施工协调</span>
                        <span class="skill-tag">预算管理</span>
                        <span class="skill-tag">质量控制</span>
                    </div>
                </div>
            </div>
            
            <div class="profile-section">
                <div class="section-header">项目经历</div>
                <div class="section-content">
                    <div class="project-list" id="projectList">
                        <div class="project-item" onclick="goToProject('project-001')">
                            <div class="project-icon">🏠</div>
                            <div class="project-info">
                                <div class="project-name">XX小区整体装修</div>
                                <div class="project-role">项目经理</div>
                            </div>
                            <div class="arrow">›</div>
                        </div>
                        <div class="project-item" onclick="goToProject('project-002')">
                            <div class="project-icon">🏢</div>
                            <div class="project-info">
                                <div class="project-name">商业办公空间装修</div>
                                <div class="project-role">项目总监</div>
                            </div>
                            <div class="arrow">›</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="page-nav">
        <div class="page-nav-title">原型导航</div>
        <a href="home.html" class="page-nav-item">首页</a>
        <a href="project-detail.html" class="page-nav-item">项目详情</a>
        <a href="member.html" class="page-nav-item">项目成员</a>
        <a href="member-profile.html" class="page-nav-item active">个人电子名片</a>
        <a href="architecture.html" class="page-nav-item">项目架构</a>
        <a href="task-list.html" class="page-nav-item">任务列表</a>
        <a href="contract-detail.html" class="page-nav-item">合同详情</a>
    </div>
    
    <script>
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function initProfile() {
            const id = getQueryParam('id');
            const name = getQueryParam('name');
            const role = getQueryParam('role');

            if (name) {
                document.getElementById('profileName').textContent = name;
                document.getElementById('infoName').textContent = name;
            }

            if (role) {
                document.getElementById('profileRole').textContent = role;
                
                const roleText = role.split(' · ')[1] || role;
                let roleClass = 'worker';
                if (roleText.includes('经理') || roleText.includes('总')) {
                    roleClass = 'manager';
                } else if (roleText.includes('工长') || roleText.includes('主管')) {
                    roleClass = 'foreman';
                } else if (roleText.includes('业主')) {
                    roleClass = 'owner';
                } else if (roleText.includes('设计师')) {
                    roleClass = 'designer';
                }
                
                const roleBadge = document.getElementById('infoRoleBadge');
                roleBadge.className = `role-badge ${roleClass}`;
                roleBadge.textContent = getRoleShortName(roleText);
            }

            if (name) {
                document.getElementById('profileAvatar').textContent = name.charAt(0);
            }
        }

        function getRoleShortName(roleText) {
            const roleMap = {
                '项目经理': '项目总',
                '施工主管': '工长',
                '业主代表': '业主',
                '设计师': '设计',
                '施工人员': '施工',
                '组长': '组长'
            };
            
            for (const [key, value] of Object.entries(roleMap)) {
                if (roleText.includes(key)) {
                    return value;
                }
            }
            return roleText;
        }

        function closeMiniProgram() {
            alert('关闭小程序');
        }

        document.addEventListener('click', function(e) {
            const actionMenu = document.getElementById('actionMenu');
            const actions = document.querySelector('.actions');
            if (actionMenu && !actions.contains(e.target) && !actionMenu.contains(e.target)) {
                actionMenu.classList.remove('show');
            }
        });

        initProfile();
    </script>
    <script src="common.js"></script>
</body>
</html>
