<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 项目详情（初始-工人视角）</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        /* 手机端小程序规范：隐藏所有滚动条 */
        ::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
        :root {
            --primary: #1677ff; --primary-bg: #e6f7ff; --primary-light: #4096ff;
            --success: #52c41a; --success-bg: #f6ffed; --warning: #fa8c16; --warning-bg: #fff7e6;
            --danger: #ff4d4f; --danger-bg: #fff2f0; --orange: #fa541c;
            --text: #222; --text-2: #555; --text-3: #999; --bg: #f2f3f5;
            --card: #fff; --border: #ececec; --shadow: 0 1px 6px rgba(0,0,0,.05);
            /* 原型导航（common.css）规范变量，用于与其他页面原型导航样式统一 */
            --primary-color: #1890FF; --bg-primary: #FFFFFF; --bg-secondary: #F5F5F5;
            --text-primary: #262626; --text-secondary: #595959; --text-tertiary: #8C8C8C; --shadow-md: rgba(0,0,0,0.1);
            /* 与 project-detail.css 对齐的渐变色（快捷入口图标用） */
            --gradient-blue: linear-gradient(135deg, #1890FF 0%, #40A9FF 100%);
            --gradient-green: linear-gradient(135deg, #52C41A 0%, #73D13D 100%);
            --gradient-orange: linear-gradient(135deg, #FA8C16 0%, #FFA940 100%);
            --gradient-purple: linear-gradient(135deg, #722ED1 0%, #9254DE 100%);
            --gradient-gold: linear-gradient(135deg, #FAAD14 0%, #FFC53D 100%);
            --gradient-cyan: linear-gradient(135deg, #13C2C2 0%, #36CFC9 100%);
            --orange-color: #FA8C16;
        }
        body {
            margin: 0; background: #e9ebee; min-height: 100vh;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex; align-items: flex-start; justify-content: center; padding: 24px; gap: 16px;
        }

        /* ===== 手机框 ===== */
        .phone-frame {
            width: 375px; height: 812px; background: var(--bg);
            border-radius: 40px; overflow: hidden; position: relative; flex-shrink: 0;
            border: 10px solid #1a1a1a;
            box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column;
        }
        .stage { position: relative; flex-shrink: 0; }
        .status-bar {
            height: 44px; background: #fff; display: flex; align-items: center;
            justify-content: space-between; padding: 0 22px; font-size: 14px;
            font-weight: 600; color: #000; flex-shrink: 0;
        }
        .nav-bar {
            height: 48px; background: #fff; display: flex; align-items: center;
            position: relative; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .nav-bar .title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: #1a1a1a; }
        .nav-bar .nb-actions { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; }
        /* 微信原生胶囊占位（由微信客户端渲染，开发者不可自定义其内容） */
        .nav-bar .native-capsule {
            display: inline-flex; align-items: center; justify-content: space-between;
            min-width: 56px; height: 28px; padding: 0 10px;
            border: 1px solid rgba(0,0,0,.08); border-radius: 14px;
            background: rgba(255,255,255,.7); color: rgba(0,0,0,.6);
            font-size: 12px; line-height: 1; user-select: none; box-sizing: border-box;
        }
        .nav-bar .native-capsule .nc-left,
        .nav-bar .native-capsule .nc-right { display: inline-flex; align-items: center; justify-content: center; flex: 1; min-width: 16px; }
        .nav-bar .native-capsule .nc-right { font-size: 10px; }
        .nav-bar .native-capsule .nc-divider { width: 1px; height: 14px; background: rgba(0,0,0,.1); margin: 0 4px; }

        /* ===== 顶部：项目切换条 ===== */
        .topbar {
            flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border);
            padding: 8px 12px; display: flex; align-items: center; gap: 10px; position: relative; z-index: 30;
        }
        .proj-switch {
            flex: 1; display: flex; align-items: stretch;
            background: #f5f7fa; border: 1px solid #e8edf3; border-radius: 12px; overflow: hidden;
        }
        .proj-info-zone {
            flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer;
            padding: 8px 10px; transition: background .15s;
        }
        .proj-info-zone:active { background: #eef2f7; }
        .proj-switch-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
        .proj-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; }
        .proj-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--primary-bg); color: var(--primary); flex: 0 0 auto; }
        .proj-status.done { background: var(--success-bg); color: var(--success); }
        .proj-switch-right {
            display: flex; align-items: center; gap: 4px; flex: 0 0 auto; cursor: pointer;
            padding: 8px 12px; border-left: 1px solid #e3e8ef; background: #fafbfc; transition: background .15s;
        }
        .proj-switch-right:active { background: #eef2f7; }
        .switch-hint { font-size: 11px; color: var(--text-3); }
        .switch-arrow { font-size: 12px; color: var(--text-3); transition: transform .25s; }
        .switch-arrow.open { transform: rotate(180deg); }

        /* ===== 项目下拉面板 ===== */
        .proj-panel {
            position: absolute; left: 0; right: 0; top: 100%; background: #fff;
            max-height: 0; overflow: hidden; transition: max-height .3s ease; z-index: 25;
            box-shadow: 0 8px 20px rgba(0,0,0,.12); border-radius: 0 0 16px 16px;
        }
        .proj-panel.open { max-height: 460px; display: flex; flex-direction: column; overflow: hidden; }
        .proj-panel-inner { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 12px; }
        .proj-option {
            border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
            transition: all .15s; background: #fff;
        }
        .proj-option:active { background: #f5f7fa; }
        .proj-option.active { border-color: var(--primary); background: #f5faff; }
        .po-top { display: flex; align-items: center; justify-content: space-between; }
        .po-name { font-size: 14px; font-weight: 600; color: var(--text); }
        .po-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--primary-bg); color: var(--primary); }
        .po-status.done { background: var(--success-bg); color: var(--success); }
        .po-addr { font-size: 12px; color: var(--text-3); margin: 4px 0; }
        .po-stats { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); margin-bottom: 6px; }
        .po-bar { height: 4px; background: #eef0f3; border-radius: 2px; overflow: hidden; }
        .po-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; }
        .proj-panel-filter { flex-shrink: 0; display: flex; gap: 6px; padding: 8px 12px 6px; border-bottom: 1px solid var(--border); background: #fff; }
        .pf-item {
            flex: 1; text-align: center; font-size: 12px; padding: 5px 0; border-radius: 8px;
            background: #f2f4f7; color: var(--text-2); cursor: pointer; transition: all .15s;
        }
        .pf-item.active { background: #333; color: #fff; font-weight: 600; }
        .proj-panel-foot {
            flex-shrink: 0; padding: 8px 12px 10px;
            border-top: 1px solid var(--border); background: #fff;
            box-shadow: 0 -2px 8px rgba(0,0,0,.04);
        }
        .proj-new-btn {
            width: 100%; padding: 9px; border: none; border-radius: 10px;
            background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
            transition: opacity .15s;
        }
        .proj-new-btn:active { opacity: .85; }
        .proj-empty { text-align: center; font-size: 12px; color: #999; padding: 18px 0; }

        /* ===== 详情滚动区 ===== */
        .page-content { flex: 1; overflow-y: auto; position: relative; }
        .page-content--full { padding: 0; }
        .detail-fade { animation: fadeUp .28s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ===== 项目基本信息头（工人视角·新项目：橙色「新家准备中」变体 + 我的工种·施工组 + 待我处理 KPI） ===== */
        .project-basic-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; margin: 8px 12px 6px;
            background: linear-gradient(135deg, #FFF7E6 0%, #FFE4BA 100%);
            border-radius: 14px; box-shadow: 0 4px 14px rgba(250,140,22,.18); cursor: pointer;
        }
        .project-basic-header .left-info { font-size: 13px; }
        .project-basic-header .role-line { color: #874D00; font-weight: 600; font-size: 13px; }
        .project-basic-header .role-line .highlight { color: var(--orange-color); font-weight: 700; font-size: 16px; margin: 0 2px; }
        .project-basic-header .sub-hint { font-size: 11px; color: #874D00; opacity: .85; margin-top: 3px; }
        .project-basic-header .right-wrap { display: flex; align-items: center; gap: 6px; }
        .project-basic-header .right-info {
            font-size: 12px; padding: 4px 10px; border-radius: 16px;
            border: 1px solid rgba(250,140,22,.25); background-color: rgba(255,255,255,.6); color: #874D00;
            display: inline-flex; align-items: center;
        }
        .project-basic-header .right-info.worker-stat { background-color: var(--orange-color); color: #fff; border-color: transparent; }
        .project-basic-header .right-info.worker-stat .highlight { color: #fff; font-weight: 700; font-size: 14px; margin: 0 2px; }
        .project-basic-header .enter-arrow { font-size: 18px; color: #FA8C16; opacity: .9; }

        /* ===== 通用卡片 ===== */
        .card {
            background: var(--card); border-radius: 14px; padding: 10px 12px; margin: 8px 10px; box-shadow: var(--shadow);
        }
        .card-title {
            display: flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 7px; gap: 6px;
            position: relative; padding-left: 12px;
        }
        .card-title::before {
            content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 4px; height: 14px; border-radius: 2px; background: var(--gradient-blue);
        }
        .card.todo-card .card-title::before { background: var(--gradient-orange); }
        .card-title .badge-wrap { display: inline-flex; }
        .card-title .badge {
            background: var(--danger-bg); color: var(--danger); font-size: 11px; font-weight: 600;
            min-width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px;
        }
        .card-title .more { margin-left: auto; font-size: 12px; color: var(--text-3); font-weight: 400; }

        /* ===== 待办（工人视角：分组 + 空态） ===== */
        .todo-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f5f5f5; }
        .todo-item:last-child { border-bottom: none; }
        .todo-item .icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex: 0 0 auto; }
        .todo-item .content { flex: 1; min-width: 0; }
        .todo-item .title { font-size: 13px; color: var(--text); font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .todo-item .desc { font-size: 11px; color: var(--text-3); margin-top: 3px; }
        .todo-item .status { font-size: 11px; padding: 3px 9px; border-radius: 10px; flex: 0 0 auto; font-weight: 500; }
        .status.urgent { background: var(--danger-bg); color: var(--danger); }
        .status.pending { background: var(--warning-bg); color: var(--warning); }
        .status.in-progress { background: var(--primary-bg); color: var(--primary); }
        .task-tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
        .task-tag.contract { background: #e6f7ff; color: #1677ff; }
        .task-tag.task { background: #f6ffed; color: #52c41a; }
        .todo-group-label { font-size: 12px; color: var(--text-3); font-weight: 500; margin: 4px 2px 2px; padding-left: 2px; }
        .todo-content .empty-state, .contract-list .empty-state {
            display: none; text-align: center; color: var(--text-3); font-size: 12px; padding: 16px 0; line-height: 1.6;
        }
        .todo-content.is-empty .empty-state, .contract-list.is-empty .empty-state { display: block; }
        .todo-content.is-empty .todo-item, .todo-content.is-empty .todo-group-label { display: none; }

        /* ===== 吸顶快捷入口 + 架构（与 project-list 对齐） ===== */
        .sticky-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(255,255,255,.92);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
            backdrop-filter: saturate(180%) blur(12px);
            border-radius: 0 0 14px 14px;
            padding: 5px 10px; margin-bottom: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            transition: box-shadow .25s;
        }
        .sticky-header.with-shadow { box-shadow: 0 4px 16px rgba(0,0,0,.08); }

        .quick-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 2px 8px 0;
            background: transparent;
            position: relative;
        }
        .quick-nav-item {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; padding: 4px 2px; border-radius: 8px;
            transition: all .2s;
        }
        .quick-nav-item:active { transform: scale(0.95); background: var(--primary-bg); }
        .quick-nav-item .icon {
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; margin-bottom: 2px; color: #fff;
            position: relative;
        }
        .quick-nav-item .icon.info { background: var(--gradient-blue); }
        .quick-nav-item .icon.structure { background: var(--gradient-green); }
        .quick-nav-item .icon.member { background: var(--gradient-orange); }
        .quick-nav-item .icon.file { background: var(--gradient-purple); }
        .quick-nav-item .icon.statement { background: var(--gradient-gold); }
        .quick-nav-item .icon.tasks { background: var(--gradient-blue); }
        .quick-nav-item .icon.activity { background: var(--gradient-cyan); }
        .quick-nav-item .icon.contract { background: var(--gradient-orange); }
        .quick-nav-item .icon.more { background: linear-gradient(135deg, #8C8C8C 0%, #BFBFBF 100%); }
        .quick-nav-item .label { font-size: 11px; color: var(--text-2); text-align: center; line-height: 1.2; }
        .quick-nav-item .nav-badge {
            position: absolute; top: -4px; right: -4px;
            background: var(--danger); color: #fff;
            font-size: 10px; min-width: 14px; height: 14px; border-radius: 7px;
            padding: 0 3px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
        }
        .pin-btn { font-size: 11px; color: var(--text-3); padding: 4px 2px; cursor: pointer; }

        /* 更多面板（低频入口：架构/成员/资料） */
        .more-panel { display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 8px 8px 4px; background: transparent; }
        .more-panel.show { display: grid; }

        /* 快捷入口折叠（吸顶滚动后） */
        .quick-nav-toggle { display: none; padding: 4px 8px; cursor: pointer; }
        .quick-nav.collapsed { grid-template-columns: repeat(2, max-content); justify-content: flex-start; gap: 12px; }
        .quick-nav.collapsed .quick-nav-item { display: none; }
        .quick-nav.collapsed .quick-nav-item.keep { display: flex; opacity: 1; pointer-events: auto; }
        .quick-nav.collapsed + .more-panel,
        .quick-nav.collapsed ~ .quick-nav-toggle { display: block; }

        /* 架构选择器 */
        .level-selector {
            margin-top: 2px; border-top: 1px solid #f0f0f0; padding-top: 2px; position: relative; z-index: 50;
        }
        .level-dropdown { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .level-dropdown .current { display: flex; align-items: center; }
        .level-dropdown .current .icon {
            width: 32px; height: 32px; border-radius: 8px; background: var(--gradient-blue);
            display: flex; align-items: center; justify-content: center;
            margin-right: 10px; font-size: 14px; color: #fff; flex: 0 0 auto;
        }
        .level-dropdown .text-row { display: flex; align-items: center; gap: 6px; }
        .level-dropdown .text { font-size: 14px; font-weight: 600; color: var(--text); }
        .level-dropdown .type-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--primary-bg); color: var(--primary); }
        .level-dropdown .type-badge.workgroup { background: var(--success-bg); color: var(--success); }
        .level-dropdown .arrow { color: var(--text-3); transition: transform .3s; }
        .level-dropdown .arrow.open { transform: rotate(180deg); }
        .breadcrumb-inline { display: flex; align-items: center; font-size: 11px; color: var(--text-3); margin-top: 2px; }
        .breadcrumb-inline .breadcrumb-item { color: var(--text-3); }
        .breadcrumb-inline .breadcrumb-item.active { color: var(--primary); font-weight: 500; }
        .breadcrumb-inline .separator { margin: 0 4px; color: var(--text-3); }
        .level-default-hint { font-size: 10px; color: #FA8C16; margin-top: 2px; }
        .level-options {
            position: absolute; left: 0; right: 0; top: 100%;
            background: #fff; border-radius: 0 0 12px 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,.12);
            display: none; z-index: 100; padding: 4px 0;
        }
        .level-options.show { display: block; }
        .level-option { display: flex; align-items: center; padding: 10px 12px; cursor: pointer; }
        .level-option:active { background: #f5f7fa; }
        .level-option.selected { background: #f5faff; }
        .level-option .icon { width: 28px; height: 28px; border-radius: 6px; background: var(--gradient-blue); display: flex; align-items: center; justify-content: center; margin-right: 10px; font-size: 12px; color: #fff; flex: 0 0 auto; }
        .level-option .info { flex: 1; }
        .level-option .name { font-size: 13px; font-weight: 500; color: var(--text); }
        .level-option .count { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .level-option .check { margin-left: auto; color: var(--primary); font-size: 14px; }

        /* ===== 合同（工人视角：直接展示列表，无统计项） ===== */
        .stats-row { display: block; margin: 0 10px 8px; }
        .stats-row > .card { margin: 0 0 8px 0; padding: 10px 12px; }
        .stats-row > .card:last-child { margin-bottom: 0; }
        .card.contract-half .card-title .more { display: none; }
        .card.contract-half .contract-summary { display: none; }
        .card.contract-half .contract-list {
            display: block; max-height: 280px; overflow-y: auto; margin-top: 4px; padding-top: 4px;
            border-top: 1px solid #E8E8E8;
        }
        .contract-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background .15s; }
        .contract-item:last-child { border-bottom: none; }
        .contract-item .info { flex: 1; min-width: 0; }
        .contract-item .name { font-size: 13px; color: var(--text); font-weight: 500; }
        .contract-item .meta-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--text-3); margin-top: 2px; }
        .contract-item .action-badge { display: inline-block; font-size: 10px; line-height: 16px; height: 16px; padding: 0 6px; border-radius: 8px; margin-top: 2px; font-weight: 500; }
        .contract-item .action-badge.amber { background-color: #FFF7E6; color: #FA8C16; }
        .contract-item .action-badge.red { background-color: #FFF1F0; color: #F5222D; }
        .contract-item .action-badge.green { background-color: #F6FFED; color: #52C41A; }
        .progress-wrap { width: 64px; flex: 0 0 auto; text-align: right; }
        .progress-wrap .percent { font-size: 11px; color: var(--text-2); margin-bottom: 3px; }
        .progress-wrap .bar { height: 4px; background: #eef0f3; border-radius: 2px; overflow: hidden; }
        .progress-wrap .fill { height: 100%; background: var(--primary); border-radius: 2px; }

        /* ===== 原型导航 ===== */
        .page-nav {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            width: 200px; background: var(--bg-primary); border-radius: 8px; padding: 16px; box-shadow: 0 2px 10px var(--shadow-md);
            max-height: calc(100vh - 40px); overflow-y: auto; transition: all .3s;
        }
        .page-nav-title { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: var(--text-primary); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
        .page-nav-title .toggle-btn { font-size: 12px; color: var(--text-tertiary); transition: transform .3s; display: inline-block; }
        .page-nav-title .toggle-btn.collapsed { transform: rotate(-90deg); }
        .page-nav.collapsed { max-height: 60px; overflow: hidden; }
        .page-nav.collapsed .page-nav-title { margin-bottom: 0; }
        .page-nav a { display: block; padding: 8px 12px; margin: 4px 0; background-color: var(--bg-secondary); border-radius: 4px; text-decoration: none; color: var(--text-secondary); font-size: 12px; transition: all .2s; }
        .page-nav a.active { background-color: var(--primary-color); color: #fff; }
        .page-nav a:hover { background-color: var(--primary-color); color: #fff; }

        /* 小程序底部主导航 */
        .tab-bar {
            height: 50px; background: var(--card); display: flex; border-top: 1px solid var(--border);
            position: absolute; bottom: 0; left: 0; right: 0; flex-shrink: 0;
        }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; }
        .tab-item .icon { font-size: 20px; margin-bottom: 2px; }
        .tab-item .label { font-size: 10px; }
        .tab-item.active { color: var(--primary); }
        .tab-item:not(.active) { color: var(--text-3); }
    </style>
</head>
<body>
    <div class="page-nav">
        <div class="page-nav-title" onclick="togglePageNav()" title="收起 / 展开 原型导航">原型导航 <span class="toggle-btn" id="pageNavToggle">▼</span></div>
        <a href="home.html">首页</a>
        <a href="project-list.html">项目列表</a>
        <a href="project-detail.html">项目详情</a>
        <a href="project-detail-ongoing-v2.html">项目详情（进行中-新版）</a>
        <a href="project-detail-worker.html">项目详情（工人）</a>
        <a href="project-detail-initial-v2.html">项目详情（初始-新版）</a>
        <a href="project-detail-initial-worker.html" class="active">项目详情（初始-工人视角）</a>
        <a href="project-detail-completed-v2.html">项目详情（已完成-新版）</a>
        <a href="project-info.html">项目信息</a>
        <a href="architecture.html">项目架构</a>
        <a href="create-project.html">创建项目</a>
        <a href="worker-contract-detail.html?viewer=receiver&status=worker_confirmed_receiver">工人合同详情</a>
        <a href="task-detail.html">任务详情</a>
    </div>

    <div class="stage">
    <div class="phone-frame">
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="icons">📶 🔋</div>
        </div>
        <div class="nav-bar">
            <div class="title">项目详情</div>
            <div class="nb-actions"><div class="native-capsule" title="微信原生胶囊：由微信客户端渲染，开发者不可自定义其内容"><span class="nc-left">⋯</span><span class="nc-divider"></span><span class="nc-right">○</span></div></div>
        </div>

        <!-- 顶部：项目切换条 -->
        <div class="topbar">
            <div class="proj-switch">
                <div class="proj-info-zone">
                    <div class="proj-switch-left">
                        <span class="proj-name" id="curProjName">—</span>
                        <span class="proj-status" id="curProjStatus">—</span>
                    </div>
                </div>
                <div class="proj-switch-right" onclick="togglePanel()">
                    <span class="switch-hint">切换</span>
                    <span class="switch-arrow" id="switchArrow">▾</span>
                </div>
            </div>

            <div class="proj-panel" id="projPanel">
                <div class="proj-panel-filter" id="projPanelFilter">
                    <div class="pf-item active" data-filter="all" onclick="setPanelFilter('all', this)">全部</div>
                    <div class="pf-item" data-filter="ongoing" onclick="setPanelFilter('ongoing', this)">进行中</div>
                    <div class="pf-item" data-filter="done" onclick="setPanelFilter('done', this)">已完成</div>
                </div>
                <div class="proj-panel-inner" id="projPanelInner"></div>
                <div class="proj-panel-foot">
                    <button class="proj-new-btn" onclick="createProject()">＋ 新建项目</button>
                </div>
            </div>
        </div>

        <!-- 详情区（滚动容器） -->
        <div class="page-content page-content--full" id="pageContent"></div>

        <!-- 小程序主导航（项目为当前选中项） -->
        <div class="tab-bar">
            <div class="tab-item" onclick="location.href='home.html'">
                <div class="icon">🏠</div>
                <div class="label">首页</div>
            </div>
            <div class="tab-item active">
                <div class="icon">📋</div>
                <div class="label">项目</div>
            </div>
            <div class="tab-item" onclick="location.href='message.html'">
                <div class="icon">💬</div>
                <div class="label">消息</div>
            </div>
            <div class="tab-item" onclick="showToast('个人中心开发中')">
                <div class="icon">👤</div>
                <div class="label">我的</div>
            </div>
        </div>
    </div>
    </div>

    <script>
        /* ===================== 原型导航 收起/展开 ===================== */
        function togglePageNav() {
            var nav = document.querySelector('.page-nav');
            var btn = document.getElementById('pageNavToggle');
            if (!nav) return;
            var collapsed = nav.classList.toggle('collapsed');
            if (btn) btn.classList.toggle('collapsed', collapsed);
            try { localStorage.setItem('pageNavCollapsed', collapsed ? 'true' : 'false'); } catch (e) {}
        }
        (function restorePageNav() {
            try {
                if (localStorage.getItem('pageNavCollapsed') === 'true') {
                    var nav = document.querySelector('.page-nav');
                    var btn = document.getElementById('pageNavToggle');
                    if (nav) nav.classList.add('collapsed');
                    if (btn) btn.classList.add('collapsed');
                }
            } catch (e) {}
        })();

        /* ===================== 数据 ===================== */
        // 初始项目（刚创建，工人视角）：读取 localStorage.newProjectData，缺省示例新项目
        var newProject = (function () {
            var d = null;
            try { d = JSON.parse(localStorage.getItem('newProjectData')); } catch (e) { d = null; }
            if (!d) d = {};
            var area = d.area ? (parseFloat(d.area).toFixed(1) + 'm²') : '75.0m²';
            var houseType = d.houseType || '2室1厅';
            return {
                name: d.projectName || 'XX小区整体装修',
                status: '进行中',
                area: area + ' ' + houseType,
                contractSigned: 0, contractTotal: 0, taskDone: 0, taskTotal: 0,
                todoCount: 0
            };
        })();

        var PROJECTS = [ newProject ];
        var currentIndex = 0;
        var currentRole = 'worker'; // 初始项目页：工人视角
        var panelFilter = 'all';

        /* ===================== 渲染：项目切换条 ===================== */
        function renderSwitchBar() {
            var p = PROJECTS[currentIndex];
            document.getElementById('curProjName').textContent = p.name;
            var st = document.getElementById('curProjStatus');
            st.textContent = p.status;
            st.className = 'proj-status' + (p.status === '已完工' ? ' done' : '');
        }

        function renderPanel() {
            var list = PROJECTS.filter(function (p) {
                if (panelFilter === 'ongoing') return p.status === '进行中';
                if (panelFilter === 'done') return p.status === '已完工' || p.status === '已完成';
                return true;
            });
            if (list.length === 0) {
                document.getElementById('projPanelInner').innerHTML = '<div class="proj-empty">暂无匹配的项目</div>';
                return;
            }
            var html = list.map(function (p) {
                var realIdx = PROJECTS.indexOf(p);
                var pct = p.contractTotal ? Math.round(p.contractSigned / p.contractTotal * 100) : 0;
                var active = realIdx === currentIndex ? ' active' : '';
                var done = p.status === '已完工' ? ' done' : '';
                return '<div class="proj-option' + active + '" onclick="selectProject(' + realIdx + ')">' +
                    '<div class="po-top"><span class="po-name">' + p.name + '</span>' +
                    '<span class="po-status' + done + '">' + p.status + '</span></div>' +
                    '<div class="po-addr">📍 ' + p.area + '</div>' +
                    '<div class="po-stats"><span>合同 ' + p.contractSigned + '/' + p.contractTotal + '</span>' +
                    '<span>任务 ' + p.taskDone + '/' + p.taskTotal + '</span></div>' +
                    '<div class="po-bar"><div class="po-bar-fill" style="width:' + pct + '%"></div></div>' +
                    '</div>';
            }).join('');
            document.getElementById('projPanelInner').innerHTML = html;
        }

        /* ===================== 渲染：工人视角初始项目详情 ===================== */
        function renderInitialWorker(p) {
            // 架构层级选项：默认选中工人所属工作组（泥瓦工作组）
            var levels =
                '<div class="level-option" data-level="项目部" onclick="selectLevel(this)">' +
                    '<div class="icon">🏢</div><div class="info"><div class="name">项目部</div><div class="count">4个工作组 · 8份合同</div></div><div class="check" style="visibility:hidden;">✓</div></div>' +
                '<div class="level-option" data-level="水电工作组" onclick="selectLevel(this)">' +
                    '<div class="icon">⚡</div><div class="info"><div class="name">水电工作组</div><div class="count">3个施工组 · 2份合同</div></div><div class="check" style="visibility:hidden;">✓</div></div>' +
                '<div class="level-option selected" data-level="泥瓦工作组" onclick="selectLevel(this)">' +
                    '<div class="icon">⚡</div><div class="info"><div class="name">泥瓦工作组</div><div class="count">2个施工组 · 1份合同</div></div><div class="check" style="visibility:visible;">✓</div></div>' +
                '<div class="level-option" data-level="木工工作组" onclick="selectLevel(this)">' +
                    '<div class="icon">⚡</div><div class="info"><div class="name">木工工作组</div><div class="count">2个施工组 · 1份合同</div></div><div class="check" style="visibility:hidden;">✓</div></div>' +
                '<div class="level-option" data-level="油漆工作组" onclick="selectLevel(this)">' +
                    '<div class="icon">⚡</div><div class="info"><div class="name">油漆工作组</div><div class="count">1个施工组 · 1份合同</div></div><div class="check" style="visibility:hidden;">✓</div></div>';

            return '<div class="detail-fade">' +
                // 工人视角头部：我的工种·施工组 + 待我处理 KPI（橙色新项目变体）
                '<div class="project-basic-header clickable" onclick="viewProjectInfo()">' +
                    '<div class="left-info">' +
                        '<div class="role-line">我的工种 <span class="highlight">泥瓦</span> · 施工组A</div>' +
                        '<div class="sub-hint">新家准备中，待工长分配任务、发起合同</div>' +
                    '</div>' +
                    '<div class="right-wrap">' +
                        '<div class="right-info worker-stat">待我处理 <span class="highlight">0</span></div>' +
                        '<span class="enter-arrow">›</span>' +
                    '</div>' +
                '</div>' +
                // 待办事项（工人视角：按「任务执行·确认」「合同确认·签约」分组；初始态无待办）
                '<div class="card todo-card" id="todoCard">' +
                    '<div class="card-title"><span>📋 待办事项</span>' +
                        '<span class="badge-wrap"><span class="badge">0</span></span>' +
                        '<span class="more" onclick="go(\'todo-list.html\')">查看全部 ></span></div>' +
                    '<div class="todo-content is-empty" id="todoContent">' +
                        '<div class="todo-group-label">任务执行 · 确认</div>' +
                        '<div class="todo-group-label">合同确认 · 签约</div>' +
                        '<div class="empty-state">项目刚创建，待工长分配任务、发起合同后将在此显示</div>' +
                    '</div>' +
                '</div>' +
                // 吸顶快捷入口 + 架构（工人视角：全部任务 / 项目动态 / 我的合同 / 更多）
                '<div class="sticky-header" id="stickyHeader">' +
                    '<div class="quick-nav" id="quickNav">' +
                        '<div class="pin-btn" id="pinBtn">📌 固定</div>' +
                        '<div class="quick-nav-item keep" data-href="task-list.html"><div class="icon tasks">🗂️</div><div class="label">全部任务<span class="nav-badge">0</span></div></div>' +
                        '<div class="quick-nav-item keep" data-href="activity-list.html"><div class="icon activity">📝</div><div class="label">项目动态</div></div>' +
                        '<div class="quick-nav-item" data-scroll="#contractListWorker"><div class="icon file">📄</div><div class="label">我的合同</div></div>' +
                        '<div class="quick-nav-item" data-action="more"><div class="icon more">⋯</div><div class="label">更多</div></div>' +
                    '</div>' +
                    '<div class="more-panel" id="morePanel">' +
                        '<div class="quick-nav-item" data-href="architecture.html"><div class="icon structure">🏗️</div><div class="label">架构</div></div>' +
                        '<div class="quick-nav-item" data-href="member.html"><div class="icon member">👥</div><div class="label">成员</div></div>' +
                        '<div class="quick-nav-item" data-href="project-files.html"><div class="icon file">📁</div><div class="label">资料</div></div>' +
                    '</div>' +
                    '<div class="quick-nav-toggle" id="quickNavToggle" onclick="toggleQuickNav()"><div class="toggle-btn"><span id="toggleText">展开快捷入口</span><span class="arrow" id="toggleArrow">▼</span></div></div>' +
                    '<div class="level-selector arch-half" id="levelSelector">' +
                        '<div class="level-dropdown" onclick="toggleLevelDropdown()">' +
                            '<div class="current"><div class="icon">⚡</div><div>' +
                                '<div class="text-row"><div class="text">泥瓦工作组</div><div class="type-badge workgroup">工作组</div></div>' +
                                '<div class="breadcrumb-inline"><span class="breadcrumb-item">项目部</span><span class="separator">›</span><span class="breadcrumb-item active">泥瓦工作组</span></div>' +
                                '<div class="level-default-hint">默认我的工作组</div>' +
                            '</div></div>' +
                            '<div class="arrow" id="levelArrow">▼</div>' +
                        '</div>' +
                        '<div class="level-options" id="levelOptions">' + levels + '</div>' +
                    '</div>' +
                '</div>' +
                // 合同（工人视角：直接展示列表，无统计项；初始态无合同）
                '<div class="stats-row">' +
                    '<div class="card contract-half">' +
                        '<div class="card-title"><span>📄 合同</span></div>' +
                        '<div class="contract-list is-empty" id="contractListWorker">' +
                            '<div class="empty-state">暂无合同，待工长发起班组合同后在此查看</div>' +
                        '</div>' +
                    '</div>' +
                '</div>' +
                '<div style="height:16px;"></div>' +
                '</div>';
        }

        /* ===================== 主渲染 ===================== */
        function renderDetail() {
            var p = PROJECTS[currentIndex];
            document.getElementById('pageContent').innerHTML = renderInitialWorker(p);
            refreshEmptyStates();
        }

        /* ===================== 交互 ===================== */
        function togglePanel() {
            var panel = document.getElementById('projPanel');
            var arrow = document.getElementById('switchArrow');
            var open = panel.classList.toggle('open');
            arrow.classList.toggle('open', open);
        }

        function selectProject(i) {
            currentIndex = i;
            renderSwitchBar();
            renderPanel();
            togglePanel();
            renderDetail();
        }

        function setPanelFilter(f, el) {
            panelFilter = f;
            var items = document.querySelectorAll('#projPanelFilter .pf-item');
            items.forEach(function (it) { it.classList.remove('active'); });
            if (el) el.classList.add('active');
            renderPanel();
        }

        function createProject() {
            location.href = 'create-project.html';
        }

        function navigate(href) { if (href) window.location.href = href; }
        function go(href) { navigate(href); }

        function viewProjectInfo() {
            window.location.href = 'project-info.html';
        }

        function showToast(msg) {
            var t = document.createElement('div');
            t.textContent = msg;
            t.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;font-size:13px;padding:10px 16px;border-radius:8px;z-index:200;white-space:nowrap;';
            document.querySelector('.phone-frame').appendChild(t);
            setTimeout(function () { t.remove(); }, 1600);
        }

        /* 架构层级下拉 + 选择（含层级联动：全部任务/项目动态 带 ?level= 参数） */
        function toggleLevelDropdown() {
            var opts = document.getElementById('levelOptions');
            var arrow = document.getElementById('levelArrow');
            var pc = document.getElementById('pageContent');
            if (!opts) return;
            if (opts.classList.contains('show')) {
                opts.classList.remove('show');
                if (arrow) arrow.classList.remove('open');
                if (pc) pc.style.overflow = 'auto';
            } else {
                opts.classList.add('show');
                if (arrow) arrow.classList.add('open');
                if (pc) pc.style.overflow = 'hidden';
            }
        }

        function selectLevel(el) {
            if (!el) return;
            var name = el.dataset.level;
            var opts = document.getElementById('levelOptions');
            if (opts) {
                opts.querySelectorAll('.level-option').forEach(function (o) {
                    var chk = o.querySelector('.check');
                    if (o === el) { o.classList.add('selected'); if (chk) chk.style.visibility = 'visible'; }
                    else { o.classList.remove('selected'); if (chk) chk.style.visibility = 'hidden'; }
                });
            }
            var isProject = (name === '项目部');
            var ddText = document.querySelector('#levelSelector .level-dropdown .text');
            var ddType = document.querySelector('#levelSelector .level-dropdown .type-badge');
            var bc = document.querySelector('#levelSelector .breadcrumb-inline');
            if (ddText) ddText.textContent = name;
            if (ddType) { ddType.textContent = isProject ? '项目部' : '工作组'; ddType.className = 'type-badge ' + (isProject ? 'project' : 'workgroup'); }
            if (bc) {
                bc.innerHTML = isProject
                    ? '<span class="breadcrumb-item active">项目部</span>'
                    : '<span class="breadcrumb-item">项目部</span><span class="separator">›</span><span class="breadcrumb-item active">' + name + '</span>';
            }
            // 层级联动：快捷入口「全部任务」「项目动态」带 ?level= 参数
            document.querySelectorAll('.quick-nav-item').forEach(function (m) {
                var h = m.dataset.href || '';
                if (h.indexOf('task-list.html') === 0) {
                    m.dataset.href = isProject ? 'task-list.html' : 'task-list.html?level=' + encodeURIComponent(name);
                } else if (h.indexOf('activity-list.html') === 0) {
                    m.dataset.href = isProject ? 'activity-list.html' : 'activity-list.html?level=' + encodeURIComponent(name);
                }
            });
            toggleLevelDropdown();
        }

        /* 快捷入口：固定 / 更多 / 滚动到合同 / 跳转 */
        function toggleQuickNav() {
            var qn = document.getElementById('quickNav');
            var txt = document.getElementById('toggleText');
            if (!qn) return;
            if (qn.classList.contains('collapsed')) {
                qn.classList.remove('collapsed');
                if (txt) txt.textContent = '收起快捷入口';
            } else {
                qn.classList.add('collapsed');
                if (txt) txt.textContent = '展开快捷入口';
            }
        }

        function toggleMorePanel() {
            var mp = document.getElementById('morePanel');
            if (mp) mp.classList.toggle('show');
        }

        function refreshEmptyStates() {
            var tc = document.getElementById('todoContent');
            if (tc) tc.classList.toggle('is-empty', tc.querySelectorAll('.todo-item').length === 0);
            var cl = document.getElementById('contractListWorker');
            if (cl) cl.classList.toggle('is-empty', cl.querySelectorAll('.contract-item').length === 0);
        }

        /* 滚动联动：仅维护吸顶阴影 + 滚动后折叠快捷入口 */
        (function initScrollFx() {
            var scroller = document.getElementById('pageContent');
            if (!scroller) return;
            scroller.addEventListener('scroll', function () {
                var top = scroller.scrollTop;
                var sh = document.getElementById('stickyHeader');
                if (sh) { if (top > 4) sh.classList.add('with-shadow'); else sh.classList.remove('with-shadow'); }
            }, { passive: true });
        })();

        /* data-href 跳转（合同项、快捷入口等） */
        document.addEventListener('click', function (e) {
            // 面板外部点击收起
            var panel = document.getElementById('projPanel');
            var topbar = document.querySelector('.topbar');
            if (panel && panel.classList.contains('open') && topbar && !topbar.contains(e.target)) {
                togglePanel();
            }
            // 层级下拉外部点击收起
            var ls = document.getElementById('levelSelector');
            var lo = document.getElementById('levelOptions');
            var la = document.getElementById('levelArrow');
            if (ls && lo && !ls.contains(e.target)) { lo.classList.remove('show'); if (la) la.classList.remove('open'); if (document.getElementById('pageContent')) document.getElementById('pageContent').style.overflow = 'auto'; }

            // 快捷入口点击
            var qn = e.target.closest && e.target.closest('#quickNav');
            if (qn) {
                var pin = e.target.closest('.pin-btn');
                if (pin) {
                    if (qn.classList.contains('pinned')) { qn.classList.remove('pinned'); pin.textContent = '📌 固定'; }
                    else { qn.classList.add('pinned'); pin.textContent = '📌 取消固定'; }
                    return;
                }
                var item = e.target.closest('.quick-nav-item');
                if (item) {
                    if (item.dataset.action === 'more') { toggleMorePanel(); return; }
                    if (item.dataset.scroll) {
                        var target = document.querySelector(item.dataset.scroll);
                        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        return;
                    }
                    navigate(item.dataset.href);
                }
                return;
            }
            // 更多面板点击后收起
            var mp = e.target.closest && e.target.closest('#morePanel');
            if (mp) {
                var mi = e.target.closest('.quick-nav-item');
                if (mi) { navigate(mi.dataset.href); var mpEl = document.getElementById('morePanel'); if (mpEl) mpEl.classList.remove('show'); }
            }
        });

        /* ===================== 初始化 ===================== */
        renderSwitchBar();
        renderPanel();
        renderDetail();
    </script>
</body>
</html>
