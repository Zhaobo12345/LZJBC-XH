<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 项目架构（初始状态）</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-content {
            height: calc(100% - 44px);
            background-color: var(--bg-secondary);
            overflow-y: auto;
        }

        .architecture-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            padding: 12px 16px;
            color: #FFFFFF;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            flex: 1;
        }

        .project-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        .stat-item-inline {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
        }

        .stat-item-inline .num {
            font-weight: 600;
        }

        .create-btn-inline {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 12px;
            background-color: rgba(255,255,255,0.2);
            color: #FFFFFF;
            border-radius: 14px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.2s;
        }

        .create-btn-inline:hover {
            background-color: rgba(255,255,255,0.3);
        }

        .architecture-tree {
            padding: 16px;
            padding-bottom: 80px;
        }

        .tree-node {
            margin-bottom: 8px;
        }

        .node-card {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            background-color: var(--bg-primary);
            border-radius: 8px;
            border-left: 4px solid var(--primary-color);
            box-shadow: 0 1px 3px var(--shadow-color);
        }

        .node-card .node-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: linear-gradient(135deg, #E6F7FF 0%, #BAE7FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 20px;
            flex-shrink: 0;
        }

        .node-card .node-info {
            flex: 1;
            min-width: 0;
        }

        .node-card .node-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .node-card .node-type {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            background-color: var(--status-primary-bg);
            color: var(--primary-color);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .node-card .node-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .node-card .node-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .node-card .node-meta .meta-icon {
            font-size: 13px;
        }

        .node-card .progress-section {
            margin-top: 8px;
        }

        .node-card .progress-bar-wrap {
            height: 4px;
            background-color: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
        }

        .node-card .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--primary-light) 100%);
            border-radius: 2px;
            width: 0%;
            transition: width 0.3s;
        }

        .node-card .progress-text {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 4px;
            text-align: right;
        }

        .add-node-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            color: var(--text-tertiary);
            font-size: 13px;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .add-node-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: #E6F7FF;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">📶 🔋</div>
        </div>

        <div class="nav-bar">
            <div class="back" onclick="location.href='project-detail-new.html'">← 返回</div>
            <div class="title centered">项目架构</div>
            <div class="actions"></div>
        </div>

        <div class="page-content">
            <div class="architecture-header">
                <div class="header-top">
                    <div class="header-left">
                        <div class="project-name">XX小区整体装修</div>
                    </div>
                    <div class="create-btn-inline" onclick="alert('创建层级')">
                        <span>+</span>
                        <span>创建层级</span>
                    </div>
                </div>
                <div class="header-stats">
                    <div class="stat-item-inline">
                        <span class="num">1</span>
                        <span>个层级</span>
                    </div>
                    <div class="stat-item-inline">
                        <span class="num">0</span>
                        <span>个工作组</span>
                    </div>
                </div>
            </div>

            <div class="architecture-tree">
                <div class="tree-node">
                    <div class="node-card">
                        <div class="node-icon">🏢</div>
                        <div class="node-info">
                            <div class="node-name">项目部</div>
                            <div class="node-type">默认层级</div>
                            <div class="node-meta">
                                <div class="meta-item">
                                    <span class="meta-icon">👤</span>
                                    <span>1人</span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-icon">👥</span>
                                    <span>0个工作组</span>
                                </div>
                            </div>
                            <div class="progress-section">
                                <div class="progress-bar-wrap">
                                    <div class="progress-bar-fill"></div>
                                </div>
                                <div class="progress-text">进度 0%</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="add-node-btn" onclick="alert('添加子层级')">
                    <span>+</span>
                    <span>添加子层级</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
