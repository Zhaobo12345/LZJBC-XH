<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家装平台小程序原型 - 全部任务（空状态）</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-content {
            height: calc(100% - 44px - 44px);
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state .main-text {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state .sub-text {
            font-size: 13px;
            color: var(--text-tertiary);
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <div class="time">9:41</div>
            <div class="icons">📶 🔋</div>
        </div>
        <div class="nav-bar">
            <div class="back" onclick="location.href='project-detail-new.html'">← 返回</div>
            <div class="title centered">全部任务</div>
            <div class="actions"></div>
        </div>
        <div class="page-content">
            <div class="empty-state">
                <div class="icon">📋</div>
                <div class="main-text">暂无任务</div>
                <div class="sub-text">添加架构层级并创建合同后，任务将在此处展示</div>
            </div>
        </div>
    </div>
</body>
</html>
